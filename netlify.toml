[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Function routes MUST stay above the SPA catch-all (first match wins).
[[redirects]]
  from = "/api/generate-report"
  to = "/.netlify/functions/generate-report"
  status = 200

[[redirects]]
  from = "/report/*"
  to = "/.netlify/functions/report-view"
  status = 200

# Clean URL for the Racket Report (static page in public/) — must stay above the SPA catch-all.
[[redirects]]
  from = "/state-of-the-racket-report"
  to = "/state-of-the-racket-report.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
